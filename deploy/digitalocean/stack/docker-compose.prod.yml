# Cosas de Casa — pila de producción (1 droplet all-in-one).
#
# Diferencias clave con el entorno de desarrollo (Supabase CLI + vite/nest --watch):
#   - Caddy al frente termina TLS (Let's Encrypt) y es el ÚNICO que publica puertos (80/443).
#   - Supabase se SELF-HOSTEA con las imágenes oficiales (postgres, kong, gotrue,
#     postgrest, realtime, storage + imgproxy, postgres-meta). En dev lo daba el CLI.
#   - La API NestJS corre desde su imagen (Dockerfile.api); la web es estática.
#   - Ningún servicio salvo Caddy publica puertos: todo vive en la red docker interna.
#   - Los datos persistentes viven en el block volume montado en /mnt/cosasdecasa-data.
#
# Se invoca SIEMPRE con --env-file apuntando al .env renderizado por el bootstrap:
#   docker compose --env-file /opt/cosasdecasa/.env -f docker-compose.prod.yml up -d
# (el bootstrap.sh ya lo hace por ti).

services:
  ###########################################################################
  # Borde: Caddy (TLS automático + reverse proxy + estáticos de la web)
  ###########################################################################
  caddy:
    image: caddy:2-alpine
    container_name: cosasdecasa_caddy
    # Estáticos + TLS. Medido: 32 MB.
    mem_limit: 64m
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # La web estática que construye el bootstrap (apps/web/dist) — Caddy la sirve.
      - /mnt/cosasdecasa-data/web:/srv/web:ro
      - /mnt/cosasdecasa-data/caddy/data:/data
      - /mnt/cosasdecasa-data/caddy/config:/config
    depends_on:
      - api
      - kong
    networks:
      - cosasdecasa

  ###########################################################################
  # API NestJS (casos de uso, IA MiniMax, Web Push, baja GDPR...)
  # Interna; Caddy la expone en /api/*. Verifica el JWT de Supabase por JWKS.
  ###########################################################################
  api:
    # La imagen se construye en la máquina del desarrollador y se carga aquí por
    # SSH (deploy-from-local.sh: `docker save | ssh docker load`). NO hay registro
    # de por medio y el droplet NO la construye: `docker build` de este monorepo
    # no cabe en 1 GB de RAM. El bloque `build` se conserva porque es justo lo que
    # usa deploy-from-local.sh para construirla EN LOCAL.
    image: ${API_IMAGE:-cosasdecasa-api:latest}
    build:
      context: ../../../
      dockerfile: deploy/digitalocean/stack/Dockerfile.api
    container_name: cosasdecasa_api
    # Medido: 425 MB SIN límite de heap. Con --max-old-space-size=224 baja a ~220 MB. Es el servicio más caro de la pila.
    mem_limit: 320m
    restart: unless-stopped
    env_file:
      - /opt/cosasdecasa/.env
    environment:
      # SIN ESTO EL DROPLET DE 1 GB NO SE SOSTIENE. V8 dimensiona su heap por
      # defecto según la RAM que ve; en el droplet de 4 GB la API se comía 425 MB
      # ella sola —la mitad del presupuesto de la máquina nueva— simplemente
      # porque podía. Acotarlo la deja en ~220 MB sin efecto en la latencia: la
      # API es I/O-bound (Postgres, MiniMax, Web Push), no memory-bound.
      NODE_OPTIONS: --max-old-space-size=224
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_started
    networks:
      - cosasdecasa

  ###########################################################################
  # Supabase self-hosted
  ###########################################################################

  # --- Postgres (la base; el dominio se conecta con un rol que respeta RLS) ---
  db:
    image: supabase/postgres:17.6.1.136
    container_name: cosasdecasa_db
    # Medido: 50 MB. shared_buffers recortado abajo en `command`.
    mem_limit: 192m
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP}
    # Ajuste para 1 GB de RAM. Los defaults de la imagen supabase/postgres
    # asumen una máquina holgada; con 1 GB hay que ser explícito.
    #   shared_buffers=48MB   → la base entera son 63 MB, no hace falta más
    #   max_connections=40    → 10 contenedores + migraciones, sobra de largo
    #   work_mem=2MB          → se multiplica por operación de sort/hash
    #
    # ¡EL `-D /etc/postgresql` NO ES OPCIONAL! El CMD por defecto de la imagen es
    # `postgres -D /etc/postgresql`: supabase/postgres guarda su configuración en
    # un directorio SEPARADO del PGDATA, y es ahí donde vive listen_addresses='*'.
    #
    # Sobrescribir `command` sin repetir el -D hace que Postgres cargue el
    # postgresql.conf del datadir, que trae listen_addresses='localhost'. El
    # resultado es de los que cuesta diagnosticar: el contenedor arranca, el
    # healthcheck (pg_isready -h localhost) pasa y `docker compose ps` lo da por
    # healthy — pero NINGÚN otro contenedor puede conectar (ECONNREFUSED), así
    # que la pila entera se queda con solo `db` arriba.
    command:
      - postgres
      - -D
      - /etc/postgresql
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=40
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
    volumes:
      - /mnt/cosasdecasa-data/db:/var/lib/postgresql/data
      # OJO: NO montar sobre /docker-entrypoint-initdb.d ENTERO. La imagen
      # supabase/postgres trae ahí su migrate.sh + init-scripts/ + migrations/
      # que crean los roles base (postgres, authenticator, anon, authenticated,
      # service_role, supabase_auth_admin, ...). Taparlo deja la base SIN esos
      # roles → la API/GoTrue no pueden conectar. Inyectamos NUESTROS scripts
      # como archivos sueltos DENTRO de init-scripts/ (el prefijo 99- los hace
      # correr al final, ya creados los roles), igual que el self-hosting oficial.
      # Solo corren si la base está vacía (primer arranque).
      - /mnt/cosasdecasa-data/db-init/00-roles-passwords.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles-passwords.sql:ro
      - /mnt/cosasdecasa-data/db-init/01-realtime-publication.sql:/docker-entrypoint-initdb.d/init-scripts/99-realtime-publication.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - cosasdecasa

  # --- Kong: gateway de Supabase (reparte /auth /rest /realtime /storage) ---
  kong:
    image: kong/kong:3.9.1
    container_name: cosasdecasa_kong
    # Medido: 81 MB con KONG_NGINX_WORKER_PROCESSES=1.
    mem_limit: 128m
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      # Kong sustituye variables de entorno en el yml declarativo:
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      # kong.yml lo renderiza el bootstrap con las keys ya sustituidas.
      - /mnt/cosasdecasa-data/kong/kong.yml:/home/kong/kong.yml:ro
    depends_on:
      - auth
      - rest
      - realtime
      - storage
    networks:
      - cosasdecasa

  # --- GoTrue (Auth) ---
  auth:
    image: supabase/gotrue:v2.189.0
    container_name: cosasdecasa_auth
    # GoTrue (Go). Medido: 26 MB.
    mem_limit: 64m
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${APP_DOMAIN}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: https://${APP_DOMAIN}
      # Incluye sub-rutas (/**) para que valgan los redirect post-login del front:
      # /auth/callback (OAuth Google) y /reset-password (recuperación de contraseña).
      GOTRUE_URI_ALLOW_LIST: https://${APP_DOMAIN},https://${APP_DOMAIN}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXP}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: https://${APP_DOMAIN}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # SMTP real: rellénalo en /opt/cosasdecasa/.env para enviar correos de verdad.
      # OJO: GoTrue parsea SMTP_PORT a int al arrancar; un '' lo mata (fatal). Con
      # MAILER_AUTOCONFIRM=true y SMTP_HOST vacío no envía nada, pero el puerto debe
      # ser un entero válido igualmente → default 587 cuando no se configura SMTP.
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-no-reply@${APP_DOMAIN}}
      # OAuth Google. Credenciales en /opt/cosasdecasa/.env (GOOGLE_CLIENT_ID / GOOGLE_SECRET).
      # ENABLED por defecto en false: GoTrue es fatal al arrancar si el provider está
      # habilitado sin client_id/secret, así que se activa explícitamente vía GOOGLE_ENABLED.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://${APP_DOMAIN}/auth/v1/callback
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cosasdecasa

  # --- PostgREST (REST API sobre el esquema public) ---
  rest:
    image: postgrest/postgrest:v14.12
    container_name: cosasdecasa_rest
    # PostgREST (Haskell). Medido: 13 MB.
    mem_limit: 64m
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXP}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cosasdecasa

  # --- Realtime (postgres_changes; lo usa la web para nevera/tareas/chat...) ---
  realtime:
    image: supabase/realtime:v2.102.3
    # OJO: Kong enruta /realtime/v1 al host "realtime-dev.supabase-realtime".
    # Mantenemos ese hostname de red (network alias) por compatibilidad con la
    # config declarativa oficial de Kong.
    container_name: cosasdecasa_realtime
    # BEAM (Elixir). Medido 50 MB en el droplet de 4 GB, pero 133 MB en marcha
    # real sobre el nuevo: la VM de Erlang dimensiona sus arenas según la máquina
    # y las conexiones websocket abiertas. Con 160m se quedaba al 83 % del techo.
    mem_limit: 224m
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      # supabase/realtime v2.10x EXIGE METRICS_JWT_SECRET (firma el JWT del
      # endpoint /metrics); sin él el contenedor no arranca (System.EnvError).
      # Reutilizamos JWT_SECRET: es self-hosted single-tenant.
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      cosasdecasa:
        aliases:
          - realtime-dev.supabase-realtime

  # --- Storage (objetos: fotos de tareas y avatares) + imgproxy ---
  storage:
    image: supabase/storage-api:v1.60.4
    container_name: cosasdecasa_storage
    # Node. Medido 74 MB en el droplet viejo, pero 116 MB en marcha real aquí
    # (al 90 % de un techo de 128m — un OOM kill esperando a ocurrir). Node no
    # devuelve heap al SO con alegría y storage-api sube al servir imágenes.
    mem_limit: 224m
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - /mnt/cosasdecasa-data/storage:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    networks:
      - cosasdecasa

  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    container_name: cosasdecasa_imgproxy
    # Go. Medido: 9,5 MB, pero transformar imágenes le hace picos.
    mem_limit: 64m
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - /mnt/cosasdecasa-data/storage:/var/lib/storage
    networks:
      - cosasdecasa

  # --- postgres-meta ---
  # NO LO USA NADIE EN ESTA PILA. Se creía que lo consumía Storage, pero:
  #   - ningún servicio lo declara en `depends_on`
  #   - kong.yml (lo renderiza bootstrap.sh) no publica ninguna ruta hacia él
  # postgres-meta existe para dar introspección del esquema a Supabase Studio, y
  # aquí no hay Studio. Medía 75 MB en producción: un 9 % del presupuesto de RAM
  # del droplet nuevo, gastado en un servicio que nadie llama.
  #
  # Se deja declarado detrás de un profile por si algún día se levanta Studio:
  #   docker compose --profile studio up -d meta
  meta:
    profiles: [studio]
    image: supabase/postgres-meta:v0.96.6
    container_name: cosasdecasa_meta
    # Medido: 75 MB. Bajo perfil: no arranca por defecto (ver nota).
    mem_limit: 96m
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cosasdecasa

  ###########################################################################
  # pasarola-review — sitio estático de otro proyecto que comparte el droplet.
  ###########################################################################
  # Migrado tal cual desde el droplet viejo (su contenido vive en
  # /opt/pasarola-review). Dos cambios respecto a como estaba:
  #
  #   1. Escucha en 127.0.0.1:8088, no en 0.0.0.0:8088. En el droplet viejo se
  #      publicaba al mundo, pero el firewall de DO solo abre 22/80/443, así que
  #      NUNCA fue alcanzable desde fuera: quien lo usaba entraba por túnel SSH.
  #      Atarlo a loopback deja explícito lo que ya era cierto de hecho.
  #   2. mem_limit, como todo lo demás en esta pila.
  #
  # Si algún día quieres publicarlo de verdad, NO abras el 8088 en el firewall:
  # añade un bloque al Caddyfile (subdominio o ruta) y te lo sirve el Caddy que
  # ya está corriendo — cero contenedores y cero RAM extra frente a este nginx.
  pasarola:
    image: nginx:alpine
    container_name: pasarola-review
    restart: unless-stopped
    mem_limit: 32m
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - /opt/pasarola-review:/usr/share/nginx/html:ro
    networks:
      - cosasdecasa

networks:
  cosasdecasa:
    driver: bridge
